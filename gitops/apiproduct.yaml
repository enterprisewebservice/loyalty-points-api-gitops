# The product consumers see: in Developer Hub (API products, key requests) and
# on the console's API Products page. Key requests against it create
# APIKeyRequest objects; approvals create APIKeyApproval objects and the
# enforcement Secret. Those objects are the first audit ledger: who asked, for
# which plan, who approved, when.
apiVersion: devportal.kuadrant.io/v1alpha1
kind: APIProduct
metadata:
  name: loyalty-points-api
  namespace: api-loyalty-points
  annotations:
    backstage.io/owner: user:default/deanpeterson
spec:
  displayName: "Loyalty Points API"
  description: "Points balance and recent activity for a member, for the store app and the web storefront."
  version: v1
  approvalMode: manual
  publishStatus: Published
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: loyalty-points-api
  contact:
    team: user:default/deanpeterson
    url: https://v1-developer-hub-rhdh-test.apps.salamander.aimlworkbench.com/catalog/default/component/loyalty-points-api
  documentation:
    docsURL: https://v1-developer-hub-rhdh-test.apps.salamander.aimlworkbench.com/catalog/default/api/loyalty-points-api/definition
    openAPISpecURL: https://raw.githubusercontent.com/enterprisewebservice/loyalty-points-api-gitops/main/openapi.yaml
  tags:
    - rest
    - experimental
